# ReachInbox — free-tier friendly Blueprint (frontend + API + Postgres only)
# Redis / Elasticsearch / worker removed — in-process Postgres poller sends email.
#
# Secrets use sync: false (set in the Render Dashboard) or generateValue.

databases:
  - name: reachinbox-db
    plan: free
    databaseName: reachinbox
    user: reachinbox
    ipAllowList: []

envVarGroups:
  - name: reachinbox-secrets
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_CHANNEL_ID
        sync: false

services:
  - type: web
    name: reachinbox-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - fromGroup: reachinbox-secrets
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://reachinbox-frontend.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CALLBACK_URL
        value: https://reachinbox-api.onrender.com/api/auth/google/callback
      - key: SLACK_REDIRECT_URI
        value: https://reachinbox-api.onrender.com/api/slack/oauth/callback
      - key: ETHEREAL_HOST
        value: smtp.ethereal.email
      - key: ETHEREAL_PORT
        value: "587"
      - key: EMAIL_MIN_DELAY_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR
        value: "200"
      - key: EMAIL_POLL_INTERVAL_MS
        value: "3000"
      - key: EMAIL_POLL_BATCH_SIZE
        value: "5"
      - key: EMAIL_JOB_ATTEMPTS
        value: "3"

  - type: web
    name: reachinbox-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://reachinbox-api.onrender.com
